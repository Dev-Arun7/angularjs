<!DOCTYPE html>
<html>
<head>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-app="">
  <p>Type something:</p>

  <input type="number" ng-model="num1">
  <input type="number" ng-model="num2">
  <p> sum: {{ num1 + num2 }}</p>
</body>
</html>
