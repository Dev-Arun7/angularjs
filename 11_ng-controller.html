<!--
  File: 11_ng-controller.html
  Purpose: Demonstrates the difference between AngularJS's ng-model and ng-controller
           by showing two controllers with separate scopes and how data binding works.

  Notes:
    - Each ng-controller creates an isolated scope; data is not shared between controllers here.
    - This is a minimal learning example — modify controllers and bindings to experiment.
-->

<!--  
  Example demonstrating the difference between ng-model and ng-controller in AngularJS
  Two controllers with separate scopes 
-->


<!DOCTYPE html>
<!--  
  Example demonstrating the difference between ng-model and ng-controller in AngularJS
  Two controllers with separate scopes 
-->


<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ng-model vs ng-controller Example</title>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>

<!-- The Angular app starts here -->
<body ng-app="myApp">

  <!-- 
    ng-controller defines a section of the page that is
    managed by the 'userCtrl' controller.
  -->
  <div ng-controller="userCtrl">

    <h2>Controlled Section (userCtrl)</h2>

    <!-- 
      ng-model binds this input field to $scope.userName.
      Whatever you type here updates the variable instantly.
    -->
    <input type="text" ng-model="userName" placeholder="Enter your name">

    <!-- 
      We can use {{ userName }} directly here because it's in this controller's $scope.
    -->
    <p>Hello, {{ userName || 'Guest' }}!</p>

    <!-- 
      This button uses ng-click to run a function from the same $scope.
    -->
    <button ng-click="clearName()">Clear Name</button>

  </div>

  <!-- 
    Another controller below (adminCtrl) with its own independent $scope.
    It does not share data with userCtrl.
  -->
  <div ng-controller="adminCtrl">

    <h2>Controlled Section (adminCtrl)</h2>
    <p>Admin name: {{ adminName }}</p>

  </div>

  <script>
    // Define the AngularJS app
    var app = angular.module('myApp', []);

    // Controller 1: handles user section
    app.controller('userCtrl', function($scope) {
      // This variable belongs only to userCtrl's $scope
      $scope.userName = '';

      // A function that modifies userName
      $scope.clearName = function() {
        $scope.userName = '';
      };
    });

    // Controller 2: handles admin section
    app.controller('adminCtrl', function($scope) {
      // Separate variable for this controller
      $scope.adminName = 'Administrator';
    });
  </script>

</body>
</html>
