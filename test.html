<!DOCTYPE html>
<html>  
<head>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-app="myApp" ng-controller="myCtrl">
    <h3> Fruits List </h3>

    <input type="text" ng-model="searchText" placeholder="Search fruits...">

    <ul>
        <li ng-repeat="item in items | filter:searchText">
            {{ item }}
        </li>
    </ul>

    <input type="text" ng-model="newFruit" placeholder="Add a fruit">
    <button ng-click="addFruit()"> Add </button>

    <script>
        var app = angular.module('myApp', []);
        app.controller('myCtrl', function($scope){
            $scope.items = ['Orange', 'Banana', 'Grape', 'Apple'];

            $scope.addFruit = function(){
                if ($scope.newFruit) {
                    $scope.items.push($scope.newFruit);
                    $scope.newFruit = ''; // clear input
                }
            };
        });
    </script>
</body>
</html>


<li ng-repeat="item in items | filter:searchText">{{ item }}</li>





<input type="text" ng-model="userName" placeholder="Enter your name">
<button ng-click="greet()">Say Hi</button>
<p>{{ greeting }}</p>

<script>
  app.controller('myCtrl', function($scope) {
    $scope.greet = function() {
      $scope.greeting = 'Hello, ' + $scope.userName + '!';
    };
  });
</script>
