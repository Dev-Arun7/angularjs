<!DOCTYPE html>
<html>
    <head>
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    </head>
    <body ng-app="myApp" ng-controller="myCtrl">
        <p> Find fruit </p>
        <input type="text" ng-model="searchText" placeholder="Search fruits...">

        <ul>
            <li ng-repeat="item in items | filter:searchText"> {{ item }} 
                <button ng-click="removeFruit($index)"> ❌ </button>
            </li>
        </ul>
        <script>
            var app = angular.module('myApp', []);
            app.controller('myCtrl', function($scope){
                $scope.items = ['orange', 'banana', 'grape', 'apple', 'mango', 'kiwi', 'pear', 'peach', 'cherry', 'blueberry'];

                $scope.removeFruit = function(index) {
                    $scope.items.splice(index, 1);
                }
            })
        </script>
    </body>
</html>
